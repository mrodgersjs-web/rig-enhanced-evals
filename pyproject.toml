[project]
name = "rig-enhanced-evals"
version = "0.1.0"
description = "Self-evolving LLM evaluation harness with proof-gated results — RIG doctrine overlay reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RIG Doctrine Overlay" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
