[project]
name = "rig-enhanced-evals"
version = "0.2.0"
description = "Self-evolving LLM evaluation harness with proof-gated results - RIG doctrine overlay reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers", email = "mrodgersjs@gmail.com" }]
dependencies = []

[project.scripts]
rig-evals = "src.cli:main"
[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.0",
  "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-enhanced-evals"
Repository = "https://github.com/mrodgersjs-web/rig-enhanced-evals"
Issues = "https://github.com/mrodgersjs-web/rig-enhanced-evals/issues"
Changelog = "https://github.com/mrodgersjs-web/rig-enhanced-evals/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
